<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadPokemon()">
    <header>
        <div class="pokedexHeader"><img src="./img/pokeballtransperant.png" class="pokedexLogo"><img src="./icons/icons8-lupe-50.png" class="searchIcon" onclick="searchPokedex()"><p class="headline">PokeDex</p></div>
        <div class="pokedexHeader search"><input type="text" id="searchHeader" placeholder="Search Pokemon (ID or Name)" oninput="filter()"></div>
        <div class="pokedexHeader"><p class="howToShow">Show:</p><select id="showLimit" onchange="loadLimit()">
                <option value="20">20</option>
                <option value="40">40</option>
                <option value="60">60</option>
                <option value="80">80</option>
                <option value="100">100</option>
            </select></div>
    </header>

    <div id="content"></div>
    <footer><button onclick="loadNext()" id="loadNext"></button></footer>
</body>

</html>
