<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
    <script src="db.js"></script>
    <script src="style.js"></script>
    <script src="template.js"></script>
    <script src="language.js"></script>
    <script src="search.js"></script>
    <script src="script.js"></script>
</head>

<body onload="selectLanguage(), loadPokemon()">
    <header id="header">
        <div class="pokedexHeader"><img src="./img/pokeballtransperant.png" class="pokedexLogo"><img src="./icons/icons8-lupe-50.png" class="searchIcon" onclick="searchPokedex()" id="searchIcon"><p class="headline">PokeDex</p></div>
        <div class="pokedexHeader search" id="searchDiv"><input type="text" id="searchHeader" placeholder="Search Pokemon (ID or Name)" oninput="filter()"></div>
        <div class="pokedexHeader"><select id="language" onchange="setLanguage()">
            <option id="deutsch">DE</option>
            <option id="english">EN</option>
        </select><p class="howToShow">Show:</p><select id="showLimit" onchange="loadLimit()">
                <option id="20">20</option>
                <option id="40">40</option>
                <option id="60">60</option>
                <option id="80">80</option>
                <option id="100">100</option>
            </select></div>
    </header>

    <div id="content"></div>
    <footer><button onclick="loadNext()" id="loadNext"></button></footer>
</body>

</html>
